
name: Build ArnoldCalculator Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle Wrapper
        id: locate
        run: |
          WRAPPER=$(find . -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew was not found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | head -n 150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          chmod +x "$WRAPPER"

      - name: Build Release APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArnoldSemase-Release-APK
          path: '**/build/outputs/apk/release/*.apk'
          if-no-files-found: error
          
