name: Extract ZIP to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP into root
        run: |
          rm -rf tmp_extract
          mkdir tmp_extract
          unzip -o ArnoldCalculator.zip -d tmp_extract

          # If the ZIP has a single top-level folder, use that as the source
          src=tmp_extract
          if [ "$(find tmp_extract -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]; then
            src=$(find tmp_extract -mindepth 1 -maxdepth 1 -type d)
          fi

          rsync -a --exclude='.github' "$src"/ ./
          rm -rf tmp_extract ArnoldCalculator

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Extract ArnoldCalculator to root"
            git push
          fi
