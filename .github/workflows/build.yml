name: Build Arnold Calculator APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug and release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ArnoldCalculator-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/ArnoldCalculator-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ArnoldCalculator-apk
          path: dist/*.apk

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
